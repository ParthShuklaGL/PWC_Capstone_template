spring:
  application:
    name: java-crm
  datasource:
    # All connection settings come from the environment. There is no password in this file.
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/crm?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:5091}
  servlet:
    session:
      # The session sign-in mode: an HttpOnly cookie that holds only the session id; 30 minutes idle, like the .NET API.
      cookie:
        name: crm.session
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
      timeout: 30m
      tracking-modes: cookie

app:
  auth:
    default-mode: Jwt
    cookie-minutes: 60
    # Sign-in and register attempts allowed per client address per minute. Raise to 1000 for the proof scripts.
    login-rate-limit-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:10}
    max-failed-logins: 5
    lockout-minutes: 15
    bcrypt-strength: 12
    cookie-secure: ${COOKIE_SECURE:false}
  jwt:
    issuer: nimbus-crm
    audience: nimbus-crm-api
    access-token-minutes: 15
    # HMAC signing key: at least 32 characters, from the environment only. The app refuses to start without it.
    signing-key: ${JWT_SIGNING_KEY}
  seed:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
