# MySQL 8 and the Nimbus CRM API, for anyone without a local MySQL or JDK.
#
#   docker compose up --build        API on http://localhost:5080, MySQL on localhost:3307
#   docker compose down -v           stop, and throw the data away (the next start re-seeds)
#
# The database bootstrap is the same script you would run by hand (db-setup/01-...).

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "Nimbus#Root2026"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-setup/01-create-database.mysql.sql:/docker-entrypoint-initdb.d/01-create-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./backend-java
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://db:3306/nimbus_crm?serverTimezone=UTC"
      DB_USERNAME: crm_app
      DB_PASSWORD: "Crm#App2026"
      JWT_SECRET: "docker-local-only-signing-key-0123456789"
    ports:
      - "5080:5080"

volumes:
  db_data:
