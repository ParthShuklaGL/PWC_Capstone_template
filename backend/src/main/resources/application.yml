# Every value can be overridden with an environment variable, e.g. DB_PASSWORD, JWT_SECRET.
# Nothing secret belongs in this file for a real deployment; these are local-dev defaults.

server:
  port: ${PORT:5080}

spring:
  application:
    name: nimbus-crm-api
  datasource:
    # Create the database and the crm_app user first: db-setup/01-create-database.mysql.sql
    url: ${DB_URL:jdbc:mysql://localhost:3306/nimbus_crm?serverTimezone=UTC}
    username: ${DB_USERNAME:crm_app}
    password: ${DB_PASSWORD:Crm#App2026}
  jpa:
    # Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks that
    # the entities match it, and refuses to start if they do not.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

crm:
  jwt:
    issuer: nimbus-crm
    audience: nimbus-crm-clients
    # At least 32 characters. Set JWT_SECRET for anything other than your own machine.
    secret: ${JWT_SECRET:dev-only-signing-key-change-me-0123456789}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:480}
  cors:
    # Front-end dev servers that may call the API directly (React/Vite, Angular).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5176,http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    CRM_AUDIT: INFO
    org.hibernate.SQL: WARN
