services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: fsd
      MYSQL_USER: fsd
      MYSQL_PASSWORD: fsd_pw
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pw"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://db:3306/fsd?allowPublicKeyRetrieval=true&useSSL=false"
      DB_USER: fsd
      DB_PASSWORD: fsd_pw
    ports:
      - "8080:8080"

volumes:
  db_data:
