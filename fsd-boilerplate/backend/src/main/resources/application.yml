spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fsd?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:fsd}
    password: ${DB_PASSWORD:fsd_pw}
  jpa:
    # Boilerplate convenience. For production, switch to validate and use Flyway/Liquibase.
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  jwt:
    # At least 32 bytes. Override with JWT_SECRET outside local development.
    secret: ${JWT_SECRET:dev-only-secret-change-me-it-must-be-32-bytes-or-more}
    ttl-minutes: 60
  cookie:
    # Set to true when served over HTTPS.
    secure: ${COOKIE_SECURE:false}
  seed:
    admin-password: ${ADMIN_PASSWORD:Admin#12345}
    user-password: ${USER_PASSWORD:User#12345}
